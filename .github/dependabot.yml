version: 2
updates:
  # Keep GitHub Actions dependencies current automatically.
  # Application dependencies are managed with Bun so package.json and bun.lock
  # can be updated and validated together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
